    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #050204;
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(255, 0, 60, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 50% 85%, rgba(100, 0, 25, 0.12) 0%, transparent 50%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Glassmorphism Card Container */
        .card {
            background: rgba(18, 10, 18, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 60, 0.25);
            border-radius: 32px;
            width: 100%;
            max-width: 380px;
            padding: 35px 24px 28px 24px;
            text-align: center;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.95),
                0 0 35px rgba(255, 0, 60, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Top Glowing Neon Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff003c, #ff4d73, #ff003c, transparent);
        }

        /* Profile Area with Dual Rotating Rings */
        .profile-container {
            position: relative;
            width: 145px;
            height: 145px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Glow Pulsing Aura */
        .profile-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 0, 60, 0.25);
            filter: blur(15px);
            animation: pulseGlow 2.5s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 0.9; transform: scale(1.08); }
        }

        /* Rotating Red Line - Ring 1 */
        .rotating-ring-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 30%, #ff003c 70%, #ffffff 98%, transparent 100%);
            animation: spinRing 2.2s linear infinite;
        }

        /* Counter-Rotating Sub-Ring - Ring 2 */
        .rotating-ring-2 {
            position: absolute;
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            border-radius: 50%;
            background: conic-gradient(from 180deg, transparent 40%, #ff3366 80%, #ffffff 98%, transparent 100%);
            animation: spinRingReverse 3.5s linear infinite;
            opacity: 0.7;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Inner Mask Background */
        .profile-inner-bg {
            position: absolute;
            width: calc(100% - 10px);
            height: calc(100% - 10px);
            background: #110712;
            border-radius: 50%;
            z-index: 1;
        }

        /* Profile Image */
        .profile-img {
            width: calc(100% - 18px);
            height: calc(100% - 18px);
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* Headline Section with Cinzel Premium Font */
        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #e0d5e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        }

        /* Blue Verified Tick Badge */
        .verified-icon {
            color: #0088cc;
            font-size: 19px;
            filter: drop-shadow(0 0 6px rgba(0, 136, 204, 0.8));
        }

        /* Subtitle Styling */
        .subtitle-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .line {
            height: 1px;
            width: 25px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .subtitle {
            font-size: 10px;
            color: #bfaec2;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Premium Up-Down Moving Button */
        .btn-wrapper {
            margin-bottom: 24px;
        }

        .premium-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #ff0044 0%, #cc0033 50%, #990026 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 13px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            position: relative;
            overflow: hidden;
            animation: bounceUpDown 2s ease-in-out infinite;
            box-shadow: 
                0 10px 25px rgba(255, 0, 60, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        /* Blue Telegram Icon Container */
        .telegram-blue-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0088cc;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .telegram-blue-icon svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            transform: translate(-1px, 0px);
        }

        @keyframes bounceUpDown {
            0%, 100% {
                transform: translateY(0);
                box-shadow: 0 8px 22px rgba(255, 0, 60, 0.45);
            }
            50% {
                transform: translateY(-9px);
                box-shadow: 0 18px 32px rgba(255, 0, 60, 0.75);
            }
        }

        /* Features Section */
        .features {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            font-size: 11px;
            color: #d8cbdc;
            font-weight: 600;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            height: 5px;
            width: 5px;
            background-color: #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff003c;
        }

        /* Managed By Section */
        .managed-by {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .managed-by span {
            color: #ff335c;
            font-weight: 800;
        }

        /* Divider & Disclaimer */
        .divider {
            border: none;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            margin-bottom: 18px;
        }

        .disclaimer {
            font-size: 10px;
            color: #7a6a7e;
            line-height: 1.5;
            font-weight: 500;
        }

        .disclaimer strong {
            color: #9e8d80;
        }
